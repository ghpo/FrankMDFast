[workspace]
resolver = "3"
members = ["crates/*"]
default-members = ["crates/frankmd-app"]

[workspace.package]
version = "0.1.1"
edition = "2024"
# gpui-pre-platform pulls oo7 0.6, which needs 1.92. Keep in step with rust-toolchain.toml.
rust-version = "1.92"
license = "MIT"
repository = "https://github.com/akitaonrails/FrankMDFast"
publish = false

# ---------------------------------------------------------------------------
# Shared dependency pins. Verified against crates.io on 2026-11-04.
# See docs/research/gpui-stack.md for why each GUI pin is exact.
# ---------------------------------------------------------------------------
[workspace.dependencies]
# Internal crates
frankmd-core = { path = "crates/frankmd-core" }
frankmd-fs = { path = "crates/frankmd-fs" }
frankmd-config = { path = "crates/frankmd-config" }
frankmd-i18n = { path = "crates/frankmd-i18n" }
frankmd-markdown = { path = "crates/frankmd-markdown" }
frankmd-search = { path = "crates/frankmd-search" }
frankmd-net = { path = "crates/frankmd-net" }
frankmd-media = { path = "crates/frankmd-media" }
frankmd-ai = { path = "crates/frankmd-ai" }
frankmd-theme = { path = "crates/frankmd-theme" }
frankmd-watch = { path = "crates/frankmd-watch" }
frankmd-vim = { path = "crates/frankmd-vim" }
frankmd-workspace = { path = "crates/frankmd-workspace" }
frankmd-remote = { path = "crates/frankmd-remote" }
frankmd-testkit = { path = "crates/frankmd-testkit" }

# GUI (frankmd-app ONLY). gpui-kit is the umbrella crate of longbridge/gpui-kit
# (formerly gpui-component); it re-exports GPUI from the exact `gpui-pre =0.3.11`
# snapshot (zed@f816e1f). Exact pin: the project ships weekly 0.x releases and any
# GPUI snapshot bump may break API. Bump deliberately, together with Cargo.lock.
gpui-kit = { version = "=0.9.0", default-features = false, features = [
    "component",
    "assets",
    "tree-sitter-markdown",
] }

# Markdown / render
comrak = { version = "0.59", default-features = false }
syntect = { version = "5.3", default-features = false, features = ["default-fancy"] }
two-face = { version = "0.5", default-features = false, features = ["syntect-fancy"] }
ammonia = "4.2"
ratex-parser = "0.1.15"
ratex-layout = "0.1.15"
ratex-svg = "0.1.15"
resvg = "0.49"

# Core utilities
thiserror = "2"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde-saphyr = "2.1"
toml = "0.9"
uuid = { version = "1.29", features = ["v7", "serde"] }
sha2 = "0.11"
regex = "1.13"
fancy-regex = "0.20"
onig = { version = "6.5", default-features = false }
nucleo-matcher = "0.3"
grep-searcher = "0.1.17"
grep-regex = "0.1.14"
ignore = "0.4.34"
globset = "0.4"
similar = { version = "3.2", features = ["inline", "unicode"] }
notify = "8.2"
notify-debouncer-full = "0.7"
etcetera = "0.11"
jiff = "0.2"
emojis = "0.9"
unicode-normalization = "0.1"
unicode-segmentation = "1.13"
rustix = { version = "1.1", features = ["fs"] }
getrandom = "0.3"
secrecy = "0.10"
dotenvy = "0.15.7"
subtle = "2"
tokio-stream = { version = "0.1", features = ["sync"] }

# Remote (LAN/Tailscale) web server
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio", "query", "form", "multipart", "macros"] }
tower = { version = "0.5", default-features = false, features = ["util"] }
http-body-util = "0.1"

# Network / cloud / AI (tokio lives on a dedicated runtime; see docs/architecture.md)
tokio = { version = "1.54", default-features = false, features = ["rt-multi-thread", "sync", "time", "macros", "net", "io-util"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json", "stream", "gzip"] }
url = "2.5"
ipnet = "2.12"
hickory-resolver = "0.26"
scraper = "0.29"
aws-config = "1.13"
# No bundled HTTPS client: frankmd-media plugs the SDK into frankmd_net::TrustedClient.
aws-sdk-s3 = { version = "1.157", default-features = false, features = ["rt-tokio", "http-1x", "behavior-version-latest"] }
aws-smithy-runtime-api = { version = "1", features = ["client", "http-1x"] }
aws-smithy-types = { version = "1", features = ["http-body-1-x"] }
aws-credential-types = "1"
genai = "0.7"
base64 = "0.22"
async-channel = "2.5"
futures = "0.3"

# Media
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif", "bmp"] }
fast_image_resize = "6.1"
imagesize = "0.15"
infer = "0.22"
mime_guess = "2"

# App shell
clap = { version = "4.6", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
interprocess = "2.4"
open = "5"
trash = "5"

# Dev / test
insta = { version = "1.49", features = ["yaml", "json", "redactions", "glob"] }
tempfile = "3.27"
assert_fs = "1.1"
wiremock = "0.6.5"
proptest = "1.12"

# ---------------------------------------------------------------------------
# Lints
# ---------------------------------------------------------------------------
[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "warn"
unreachable_pub = "warn"

[workspace.lints.clippy]
dbg_macro = "deny"
# Skeleton bodies are `todo!()` until the conformance step fills them in.
todo = "warn"
unwrap_used = "warn"
# Enforced by clippy.toml: only frankmd-fs may write to the filesystem.
disallowed_methods = "deny"
disallowed_types = "deny"

# ---------------------------------------------------------------------------
# Profiles
# ---------------------------------------------------------------------------
[profile.dev]
debug = "limited"

# GPUI and its text/layout stack are unusably slow unoptimized; optimize them
# even in dev (recommended by gpui-kit's installation guide). Proc-macro crates
# are deliberately left out.
[profile.dev.package]
gpui-pre = { opt-level = 3 }
gpui-pre-platform = { opt-level = 3 }
gpui-pre-sum-tree = { opt-level = 3 }
gpui-base = { opt-level = 3 }
gpui-component = { opt-level = 3 }
gpui-kit = { opt-level = 3 }
gpui-kit-assets = { opt-level = 3 }
rustybuzz = { opt-level = 3 }
taffy = { opt-level = 3 }
ttf-parser = { opt-level = 3 }
resvg = { opt-level = 3 }
tree-sitter = { opt-level = 3 }
ropey = { opt-level = 3 }
smol = { opt-level = 3 }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
