[package]
name = "frankmd-fs"
description = "The only crate that mutates the filesystem: atomic writes, no-clobber create/rename, compat flock files, symlink-aware containment."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
frankmd-core.workspace = true
frankmd-crypto.workspace = true
thiserror.workspace = true
serde_json.workspace = true
jiff.workspace = true
trash.workspace = true
getrandom.workspace = true

[target.'cfg(unix)'.dependencies]
rustix.workspace = true

[features]
# Thread-local fault injection used by this crate's failure-path tests.
fault-injection = []

[dev-dependencies]
# Self dev-dependency: turns on `fault-injection` for the integration tests only.
frankmd-fs = { path = ".", features = ["fault-injection"] }
frankmd-testkit.workspace = true
frankmd-i18n.workspace = true
tempfile.workspace = true
serde_json.workspace = true
jiff.workspace = true
regex.workspace = true
sha2.workspace = true
serde.workspace = true

[lints]
workspace = true
