[package]
name = "frankmd-app"
description = "FrankMD desktop app: the only crate that links GPUI / gpui-kit."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "frankmdfast"
path = "src/main.rs"

[dependencies]
frankmd-core.workspace = true
frankmd-fs.workspace = true
frankmd-config.workspace = true
frankmd-i18n.workspace = true
frankmd-markdown.workspace = true
frankmd-search.workspace = true
frankmd-net.workspace = true
frankmd-media.workspace = true
frankmd-ai.workspace = true
frankmd-theme.workspace = true
frankmd-watch.workspace = true
frankmd-vim.workspace = true
frankmd-workspace.workspace = true
frankmd-remote.workspace = true

gpui-kit.workspace = true
ratex-parser.workspace = true
ratex-layout.workspace = true
ratex-svg = { workspace = true, features = ["embed-fonts"] }
anyhow.workspace = true
clap.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
jiff.workspace = true
async-channel.workspace = true
serde_json.workspace = true

# Embeds the app icon and version info in frankmd.exe (build.rs).
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1.34"

[dev-dependencies]
gpui-kit = { workspace = true, features = ["test-support"] }
tempfile.workspace = true

[lints]
workspace = true
