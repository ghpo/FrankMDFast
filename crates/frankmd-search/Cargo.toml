[package]
name = "frankmd-search"
description = "File finder (nucleo) and full-text search (ripgrep libs); editor find/replace semantics."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
frankmd-core.workspace = true
frankmd-crypto.workspace = true
thiserror.workspace = true
# Editor find/replace: JavaScript RegExp semantics (look-around, backrefs, named groups).
fancy-regex.workspace = true
# Vault content search: Ruby (Onigmo) regex semantics — multi-char case folding
# (`straße` ~ `STRASSE`), `(?-i)`, look-behind, and a match time/retry limit
# (backend.md §3 [DECIDE] → onig, see docs/testing/port-markdown-search.md).
onig.workspace = true

[dev-dependencies]
frankmd-testkit.workspace = true
serde_json.workspace = true
tempfile.workspace = true

[lints]
workspace = true
